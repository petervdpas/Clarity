name: Release Clarity.UI library

# Push a runtimes/rust-ui-ffi/v* tag (e.g. `git tag runtimes/rust-ui-ffi/v0.1.0
# && git push origin runtimes/rust-ui-ffi/v0.1.0`) to publish the Clarity.UI
# library for Go, C and C++ programs: one archive per system on a GitHub
# release of that tag. The tag must name the version in
# runtimes/rust-ui-ffi/Cargo.toml: bump that first, commit, then tag.
#
# Each archive is the folder a build's CLARITY_UI names (DESIGN 7.9):
#   include/clarity_ui.h, include/clarity_audio.h
#   lib/libclarity_ui.so | libclarity_ui.dylib | clarity_ui.dll and clarity_ui.dll.lib
#   lib/libclarity_audio.so | libclarity_audio.dylib | clarity_audio.dll and clarity_audio.dll.lib
#   lib/ the same of clarity_video, include/clarity_video.h (Clarity.Video)
# Clarity.Audio (docs/AUDIO-PLAN.md) rides along: a program links it only
# when its sound parts play songs. So does Cisco's openh264 for the system
# (lib/libopenh264-2.6.0-linux64.8.so and the like, docs/VIDEO-PLAN.md),
# fetched from Cisco and checked against runtimes/rust-video/openh264.sha256:
# every app with video carries it beside its program, so it plays offline.
# named clarity-ui-<version>-<rid>.tar.gz (Windows has tar too), for linux-x64,
# linux-arm64, win-x64, win-arm64, osx-x64 and osx-arm64. The libraries are
# built as the C# packages' are (release-csharp-runtime.yml): on each system's
# own runner, with skia-safe's prebuilt Skia; Linux on Ubuntu 22.04, so they
# ask no newer glibc than 2.35. C# carries the same library in its NuGet
# package and does not use these archives.
#
# Beside them, clarity-ui-<version>-browser.tar.gz holds the browser files
# (DESIGN 7.9, round B): clarity-ui.js, clarity-ui.wasm, clarity-ui-worker.js
# and clarity-ui-page.js, the library compiled once to WebAssembly with
# Emscripten (the version rust-skia's CI builds skia-safe's prebuilt Skia
# with), which every language's web server serves. SHA256SUMS covers all.

on:
  push:
    tags:
      - "runtimes/rust-ui-ffi/v*"

permissions:
  contents: read

jobs:
  native:
    name: Library (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            files: libclarity_ui.so
          - rid: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            files: libclarity_ui.so
          - rid: win-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            files: clarity_ui.dll clarity_ui.dll.lib
          - rid: win-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            files: clarity_ui.dll clarity_ui.dll.lib
          - rid: osx-x64
            os: macos-15
            target: x86_64-apple-darwin
            files: libclarity_ui.dylib
          - rid: osx-arm64
            os: macos-15
            target: aarch64-apple-darwin
            files: libclarity_ui.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag names the library's version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#runtimes/rust-ui-ffi/v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' runtimes/rust-ui-ffi/Cargo.toml | head -1)"
          echo "tag $tag, library $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::the tag says $tag but runtimes/rust-ui-ffi/Cargo.toml says $crate"
            exit 1
          fi

      # Skia's text needs fontconfig and freetype, the sound part ALSA.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the library
        shell: bash
        run: cargo build --release -p clarity-ui-ffi -p clarity-audio-ffi -p clarity-video-ffi --target ${{ matrix.target }}

      - name: Pack the archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#runtimes/rust-ui-ffi/v}"
          name="clarity-ui-$version-${{ matrix.rid }}"
          mkdir -p "out/$name/include" "out/$name/lib"
          cp runtimes/rust-ui-ffi/include/clarity_ui.h runtimes/rust-audio-ffi/include/clarity_audio.h runtimes/rust-video-ffi/include/clarity_video.h "out/$name/include/"
          for f in ${{ matrix.files }}; do
            cp "target/${{ matrix.target }}/release/$f" "out/$name/lib/"
            cp "target/${{ matrix.target }}/release/${f/clarity_ui/clarity_audio}" "out/$name/lib/"
            cp "target/${{ matrix.target }}/release/${f/clarity_ui/clarity_video}" "out/$name/lib/"
          done
          python3 .github/scripts/fetch_openh264.py ${{ matrix.rid }} "out/$name/lib"
          cp LICENSE "out/$name/"
          cd out
          tar czf "$name.tar.gz" "$name"
          ls -l

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.rid }}
          path: out/*.tar.gz
          if-no-files-found: error

  browser:
    name: Browser files
    runs-on: ubuntu-24.04
    env:
      # rust-skia's CI builds skia-safe 0.156's prebuilt Skia for the browser with this one.
      EMSCRIPTEN_VERSION: "6.0.9"
    steps:
      - uses: actions/checkout@v7

      - name: The tag names the library's version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#runtimes/rust-ui-ffi/v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' runtimes/rust-ui-ffi/Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::the tag says $tag but runtimes/rust-ui-ffi/Cargo.toml says $crate"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Setup Emscripten
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-emscripten

      - name: Build the browser files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#runtimes/rust-ui-ffi/v}"
          name="clarity-ui-$version-browser"
          EMSDK="$RUNNER_TEMP/emsdk" runtimes/rust-ui-browser/build.sh "out/$name"
          cp LICENSE "out/$name/"
          cd out
          tar czf "$name.tar.gz" "$name"
          ls -l

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: archive-browser
          path: out/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [native, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          path: archives
          pattern: archive-*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd archives
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # A release that exists already (an earlier run of this tag) gets the
      # archives again, replacing those of the same name.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#runtimes/rust-ui-ffi/v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" archives/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" archives/* \
              --title "Clarity.UI library $version" \
              --notes "The Clarity.UI library and its C header for Go, C and C++ programs, one archive per system: unpack it and point the environment variable CLARITY_UI at the folder. The browser archive holds the files every language's web server serves (clarity-ui.js, clarity-ui.wasm and the worker and page scripts): CLARITY_UI_BROWSER names its folder."
          fi
