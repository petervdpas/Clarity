name: Release C# runtime

# Push a runtimes/csharp/v* tag (e.g. `git tag runtimes/csharp/v0.72.0 && git
# push origin runtimes/csharp/v0.72.0`) to publish the eleven NuGet packages of
# Clarity's C# runtime: Clarity.Runtime, Clarity.Runtime.Sqlite,
# Clarity.Runtime.PostgreSql, Clarity.Runtime.MySql, Clarity.Runtime.SqlServer,
# Clarity.Runtime.Engines, Clarity.Ui, Clarity.Ui.Server, Clarity.Audio,
# Clarity.Video and Clarity.Image. Clarity.Audio, Clarity.Video and Clarity.Image
# carry their native libraries (runtimes/rust-audio-ffi, runtimes/rust-video-ffi,
# runtimes/rust-image-ffi) the same way Clarity.Ui
# carries Clarity.UI's, built in the same jobs; Clarity.Video carries Cisco's
# openh264 for each system beside its library (.github/scripts/fetch_openh264.py). Clarity.Ui.Server
# serves the browser files (release-clarity-ui.yml) that Clarity's generator
# puts in the application, and carries no native library. The tag must name the version in
# runtimes/csharp/Directory.Build.props: bump that first, commit, then tag.
#
# Clarity.Ui carries the native Clarity.UI library (runtimes/rust-ui-ffi) for
# six systems in runtimes/<rid>/native/, as SkiaSharp ships Skia. One job per
# system builds it on that system's own runner, with Skia from skia-safe's
# prebuilt binaries (they exist for all six targets with this feature set;
# Skia is never built from source). Linux arm64 and Windows arm64 build on
# GitHub's arm64 runners rather than by a cross target: the Linux library
# links the system's fontconfig, freetype and ALSA, which a cross build would
# need as an arm64 sysroot. Linux builds on Ubuntu 22.04, so the library asks
# no newer glibc than 2.35 (Debian 12 and Ubuntu 22.04 and newer). Both macOS
# libraries build on one Apple Silicon runner; Apple's toolchain builds Intel
# code as well.
#
# The packages go to nuget.org through Trusted Publishing: no API key is
# stored. The pack job asks GitHub for an OIDC token (id-token: write),
# NuGet/login trades it for a short-lived key, and dotnet nuget push uses it.
# nuget.org needs a Trusted Publishing policy for this repository and this
# file's name (release-csharp-runtime.yml), and NUGET_USER (a repository
# variable or secret) holds the nuget.org account's user name (not its e-mail). A
# version on nuget.org can never be replaced, only unlisted.

on:
  push:
    tags:
      - "runtimes/csharp/v*"

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # ───────────────────────────────────────────────────────────────
  # The native Clarity.UI library, one job per system.
  # ───────────────────────────────────────────────────────────────
  native:
    name: Native library (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            file: libclarity_ui.so
          - rid: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            file: libclarity_ui.so
          - rid: win-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            file: clarity_ui.dll
          - rid: win-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            file: clarity_ui.dll
          - rid: osx-x64
            os: macos-15
            target: x86_64-apple-darwin
            file: libclarity_ui.dylib
          - rid: osx-arm64
            os: macos-15
            target: aarch64-apple-darwin
            file: libclarity_ui.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Skia's text needs fontconfig and freetype, the sound part ALSA.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the library
        shell: bash
        run: cargo build --release -p clarity-ui-ffi -p clarity-audio-ffi -p clarity-video-ffi -p clarity-image-ffi -p clarity-formats-ffi -p clarity-auth-ffi --target ${{ matrix.target }}

      - name: Collect the libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ui out/audio out/video out/image out/formats out/auth
          file="${{ matrix.file }}"
          cp "target/${{ matrix.target }}/release/$file" out/ui/
          cp "target/${{ matrix.target }}/release/${file/clarity_ui/clarity_audio}" out/audio/
          cp "target/${{ matrix.target }}/release/${file/clarity_ui/clarity_video}" out/video/
          cp "target/${{ matrix.target }}/release/${file/clarity_ui/clarity_image}" out/image/
          cp "target/${{ matrix.target }}/release/${file/clarity_ui/clarity_formats}" out/formats/
          cp "target/${{ matrix.target }}/release/${file/clarity_ui/clarity_auth}" out/auth/
          python3 .github/scripts/fetch_openh264.py ${{ matrix.rid }} out/video
          ls -lR out

      - name: Upload the libraries
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: out/
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # The ten packages, built and tested once, pushed to nuget.org.
  # ───────────────────────────────────────────────────────────────
  pack:
    name: Pack and publish
    needs: [native]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: The tag names the packages' version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#runtimes/csharp/v}"
          props="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' runtimes/csharp/Directory.Build.props)"
          echo "tag $tag, packages $props"
          if [ "$tag" != "$props" ]; then
            echo "::error::the tag says $tag but runtimes/csharp/Directory.Build.props says $props"
            exit 1
          fi

      # Each system's libraries go where Clarity.Ui's and Clarity.Audio's projects pack them from.
      - name: Download the native libraries
        uses: actions/download-artifact@v8
        with:
          path: native
          pattern: native-*

      - name: Place the native libraries
        run: |
          set -euo pipefail
          for rid in linux-x64 linux-arm64 win-x64 win-arm64 osx-x64 osx-arm64; do
            for part in Ui Audio Video Image Formats Auth; do
              dest="runtimes/csharp/Clarity.$part/runtimes/$rid/native"
              mkdir -p "$dest"
              cp native/native-$rid/${part,,}/* "$dest/"
            done
          done
          find runtimes/csharp/Clarity.Ui/runtimes runtimes/csharp/Clarity.Audio/runtimes runtimes/csharp/Clarity.Video/runtimes runtimes/csharp/Clarity.Image/runtimes runtimes/csharp/Clarity.Formats/runtimes runtimes/csharp/Clarity.Auth/runtimes -type f | sort

      # Building in Release makes every package (GeneratePackageOnBuild) in
      # its project's bin/Release.
      - name: Build the solution
        run: dotnet build runtimes/csharp/Clarity.slnx -c Release -p:UseSharedCompilation=false -nodeReuse:false

      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fonts-droid-fallback

      - name: Test the solution
        run: xvfb-run -a dotnet test runtimes/csharp/Clarity.slnx -c Release --no-build

      - name: Check the packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#runtimes/csharp/v}"
          for p in Clarity.Runtime Clarity.Runtime.Sqlite Clarity.Runtime.PostgreSql Clarity.Runtime.MySql Clarity.Runtime.SqlServer Clarity.Runtime.Engines Clarity.Ui Clarity.Ui.Server Clarity.Audio Clarity.Video Clarity.Image Clarity.Formats Clarity.Auth; do
            nupkg="runtimes/csharp/$p/bin/Release/$p.$version.nupkg"
            test -f "$nupkg" || { echo "::error::$nupkg was not made"; exit 1; }
            mkdir -p packages
            cp "$nupkg" packages/
          done
          ui="packages/Clarity.Ui.$version.nupkg"
          for entry in \
            runtimes/linux-x64/native/libclarity_ui.so \
            runtimes/linux-arm64/native/libclarity_ui.so \
            runtimes/win-x64/native/clarity_ui.dll \
            runtimes/win-arm64/native/clarity_ui.dll \
            runtimes/osx-x64/native/libclarity_ui.dylib \
            runtimes/osx-arm64/native/libclarity_ui.dylib; do
            unzip -l "$ui" "$entry" > /dev/null || { echo "::error::Clarity.Ui lacks $entry"; exit 1; }
            audio="packages/Clarity.Audio.$version.nupkg"
            unzip -l "$audio" "${entry/clarity_ui/clarity_audio}" > /dev/null || { echo "::error::Clarity.Audio lacks ${entry/clarity_ui/clarity_audio}"; exit 1; }
            video="packages/Clarity.Video.$version.nupkg"
            unzip -l "$video" "${entry/clarity_ui/clarity_video}" > /dev/null || { echo "::error::Clarity.Video lacks ${entry/clarity_ui/clarity_video}"; exit 1; }
            image="packages/Clarity.Image.$version.nupkg"
            unzip -l "$image" "${entry/clarity_ui/clarity_image}" > /dev/null || { echo "::error::Clarity.Image lacks ${entry/clarity_ui/clarity_image}"; exit 1; }
            formats="packages/Clarity.Formats.$version.nupkg"
            unzip -l "$formats" "${entry/clarity_ui/clarity_formats}" > /dev/null || { echo "::error::Clarity.Formats lacks ${entry/clarity_ui/clarity_formats}"; exit 1; }
            auth="packages/Clarity.Auth.$version.nupkg"
            unzip -l "$auth" "${entry/clarity_ui/clarity_auth}" > /dev/null || { echo "::error::Clarity.Auth lacks ${entry/clarity_ui/clarity_auth}"; exit 1; }
          done
          unzip -l "packages/Clarity.Video.$version.nupkg" | grep -q openh264 || { echo "::error::Clarity.Video carries no openh264"; exit 1; }
          # The server draws nothing: no native library, and no package that brings one.
          server="packages/Clarity.Ui.Server.$version.nupkg"
          if unzip -l "$server" | grep -q clarity_ui; then echo "::error::Clarity.Ui.Server carries the native library"; exit 1; fi
          if unzip -p "$server" Clarity.Ui.Server.nuspec | grep -q 'id="Clarity.Ui"'; then echo "::error::Clarity.Ui.Server depends on Clarity.Ui"; exit 1; fi
          ls -l packages

      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: packages/*.nupkg
          if-no-files-found: error

      - name: The nuget.org user is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::set NUGET_USER (a repository variable or secret) to the nuget.org user name"
            exit 1
          fi

      # A short-lived, single-use key from nuget.org for this run's OIDC token.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      # A version published already (by hand, or by an earlier run of this
      # tag) is left as it is: nuget.org never takes a version twice.
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for nupkg in packages/*.nupkg; do
            dotnet nuget push "$nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
