name: Release Rust Clarity.AppMcp

# Push a runtimes/rust-app-mcp/v* tag (e.g. `git tag runtimes/rust-app-mcp/v0.1.0 &&
# git push origin runtimes/rust-app-mcp/v0.1.0`) to publish the crate
# clarity-app-mcp to crates.io (docs/ledger/app-mcp.md). The tag must name the
# version in runtimes/rust-app-mcp/Cargo.toml: bump that first, commit, then tag.
# A Rust program's runtime will name a clarity-app-mcp version once it serves
# MCP, so this release goes before the clarity-runtime release that needs it
# (tag runtimes/rust/v*).
#
# Publishes with the repository secret CARGO_REGISTRY_TOKEN (a crates.io API
# token with publish-new and publish-update, limited to clarity-*). A version on
# crates.io can never be replaced, only yanked.

on:
  push:
    tags:
      - "runtimes/rust-app-mcp/v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish clarity-app-mcp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: The tag names the crate's version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#runtimes/rust-app-mcp/v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clarity-app-mcp") | .version')"
          echo "tag $tag, crate $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::the tag says $tag but runtimes/rust-app-mcp/Cargo.toml says $crate"
            exit 1
          fi

      # The exchanges every stack shares (conformance/app-mcp.json).
      - name: Test the library
        run: cargo test -p clarity-app-mcp

      # A version published already (by hand, or by an earlier run of this
      # tag) is left as it is: crates.io never takes a version twice.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#runtimes/rust-app-mcp/v}"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'Clarity release (github.com/petervdpas/Clarity)' "https://crates.io/api/v1/crates/clarity-app-mcp/$version")"
          if [ "$status" = "200" ]; then
            echo "::notice::clarity-app-mcp $version is on crates.io already"
            exit 0
          fi
          cargo publish -p clarity-app-mcp
