name: Release Rust Clarity.Audio

# Push a runtimes/rust-audio/v* tag (e.g. `git tag runtimes/rust-audio/v0.1.0 &&
# git push origin runtimes/rust-audio/v0.1.0`) to publish the crate
# clarity-audio to crates.io (docs/AUDIO-PLAN.md). The tag must name the
# version in runtimes/rust-audio/Cargo.toml: bump that first, commit, then tag.
# clarity-ui's `audio` feature names a clarity-audio version, so this release
# goes before the clarity-ui release that needs it (tag runtimes/rust-ui/v*).
#
# Publishes with the repository secret CARGO_REGISTRY_TOKEN (a crates.io API
# token with publish-new and publish-update, limited to clarity-*). A version on
# crates.io can never be replaced, only yanked.

on:
  push:
    tags:
      - "runtimes/rust-audio/v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish clarity-audio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # What the system's sound output links on Linux.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: The tag names the crate's version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#runtimes/rust-audio/v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clarity-audio") | .version')"
          echo "tag $tag, crate $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::the tag says $tag but runtimes/rust-audio/Cargo.toml says $crate"
            exit 1
          fi

      # The tests play on a mixer of their own: no speakers needed.
      - name: Test the library
        run: cargo test -p clarity-audio

      # A version published already (by hand, or by an earlier run of this
      # tag) is left as it is: crates.io never takes a version twice.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#runtimes/rust-audio/v}"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'Clarity release (github.com/petervdpas/Clarity)' "https://crates.io/api/v1/crates/clarity-audio/$version")"
          if [ "$status" = "200" ]; then
            echo "::notice::clarity-audio $version is on crates.io already"
            exit 0
          fi
          cargo publish -p clarity-audio
