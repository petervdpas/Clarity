name: Release Rust Clarity.Image

# Push a runtimes/rust-image/v* tag (e.g. `git tag runtimes/rust-image/v0.1.0 &&
# git push origin runtimes/rust-image/v0.1.0`) to publish the crate
# clarity-image to crates.io (docs/IMAGE-PLAN.md). The tag must name the
# version in runtimes/rust-image/Cargo.toml: bump that first, commit, then tag.
# clarity-ui names a clarity-image version (its painting canvas's tools), so
# this release goes before the clarity-ui release that needs it (tag runtimes/rust-ui/v*).
#
# Publishes with the repository secret CARGO_REGISTRY_TOKEN (a crates.io API
# token with publish-new and publish-update, limited to clarity-*). A version on
# crates.io can never be replaced, only yanked.

on:
  push:
    tags:
      - "runtimes/rust-image/v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish clarity-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: The tag names the crate's version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#runtimes/rust-image/v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clarity-image") | .version')"
          echo "tag $tag, crate $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::the tag says $tag but runtimes/rust-image/Cargo.toml says $crate"
            exit 1
          fi

      # The pictures every stack gives (conformance/picture-functions.json).
      - name: Test the library
        run: cargo test -p clarity-image

      # A version published already (by hand, or by an earlier run of this
      # tag) is left as it is: crates.io never takes a version twice.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#runtimes/rust-image/v}"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'Clarity release (github.com/petervdpas/Clarity)' "https://crates.io/api/v1/crates/clarity-image/$version")"
          if [ "$status" = "200" ]; then
            echo "::notice::clarity-image $version is on crates.io already"
            exit 0
          fi
          cargo publish -p clarity-image
