name: Release Rust Clarity.Pdf

# Push a runtimes/rust-pdf/v* tag (e.g. `git tag runtimes/rust-pdf/v0.1.0 &&
# git push origin runtimes/rust-pdf/v0.1.0`) to publish the crate
# clarity-pdf to crates.io (docs/ledger/reports-pdf.md). The tag must name the
# version in runtimes/rust-pdf/Cargo.toml: bump that first, commit, then tag.
# clarity-pdf names a clarity-runtime version (it reads Markdown through it),
# so this release goes after the clarity-runtime release it needs (tag
# runtimes/rust/v*). Generated Rust programs that make PDFs name this crate.
#
# Publishes with the repository secret CARGO_REGISTRY_TOKEN (a crates.io API
# token with publish-new and publish-update, limited to clarity-*). A version on
# crates.io can never be replaced, only yanked.

on:
  push:
    tags:
      - "runtimes/rust-pdf/v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish clarity-pdf
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: The tag names the crate's version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#runtimes/rust-pdf/v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clarity-pdf") | .version')"
          echo "tag $tag, crate $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::the tag says $tag but runtimes/rust-pdf/Cargo.toml says $crate"
            exit 1
          fi

      # Markdown, the stylesheet, tables, math and the PDF.
      - name: Test the library
        run: cargo test -p clarity-pdf

      # A version published already (by hand, or by an earlier run of this
      # tag) is left as it is: crates.io never takes a version twice.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#runtimes/rust-pdf/v}"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'Clarity release (github.com/petervdpas/Clarity)' "https://crates.io/api/v1/crates/clarity-pdf/$version")"
          if [ "$status" = "200" ]; then
            echo "::notice::clarity-pdf $version is on crates.io already"
            exit 0
          fi
          cargo publish -p clarity-pdf
