name: Release Rust runtime

# Push a runtimes/rust/v* tag (e.g. `git tag runtimes/rust/v0.2.0 && git push
# origin runtimes/rust/v0.2.0`) to publish the crate clarity-runtime to
# crates.io. The tag must name the version in runtimes/rust/Cargo.toml: bump
# that first, commit, then tag. Clarity's Rust generator requires the same
# version, so generated projects follow the release.
#
# Publishes with the repository secret CARGO_REGISTRY_TOKEN (a crates.io API
# token with publish-update, limited to clarity-*). A version on crates.io can
# never be replaced, only yanked.

on:
  push:
    tags:
      - "runtimes/rust/v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish clarity-runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: The tag names the crate's version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#runtimes/rust/v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clarity-runtime") | .version')"
          echo "tag $tag, crate $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::the tag says $tag but runtimes/rust/Cargo.toml says $crate"
            exit 1
          fi

      # Every database's driver compiles, and the runtime passes its own
      # tests and the shared cases (conformance/) on SQLite.
      - name: Test the runtime
        run: |
          cargo test -p clarity-runtime
          cargo build -p clarity-runtime --features postgres,mysql,mssql

      # A version published already (by hand, or by an earlier run of this
      # tag) is left as it is: crates.io never takes a version twice.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#runtimes/rust/v}"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'Clarity release (github.com/petervdpas/Clarity)' "https://crates.io/api/v1/crates/clarity-runtime/$version")"
          if [ "$status" = "200" ]; then
            echo "::notice::clarity-runtime $version is on crates.io already"
            exit 0
          fi
          cargo publish -p clarity-runtime
