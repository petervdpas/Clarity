name: Release Rust Clarity.Video

# Push a runtimes/rust-video/v* tag (e.g. `git tag runtimes/rust-video/v0.1.0 &&
# git push origin runtimes/rust-video/v0.1.0`) to publish the crate
# clarity-video to crates.io (docs/VIDEO-PLAN.md). The tag must name the
# version in runtimes/rust-video/Cargo.toml: bump that first, commit, then tag.
# clarity-ui's `video` feature names a clarity-video version, so this release
# goes before the clarity-ui release that needs it (tag runtimes/rust-ui/v*).
#
# Publishes with the repository secret CARGO_REGISTRY_TOKEN (a crates.io API
# token with publish-new and publish-update, limited to clarity-*). A version on
# crates.io can never be replaced, only yanked.

on:
  push:
    tags:
      - "runtimes/rust-video/v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish clarity-video
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # Nothing of a system decoder is needed to build: GStreamer, codec
      # libraries and openh264 are loaded at run time.

      - name: The tag names the crate's version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#runtimes/rust-video/v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clarity-video") | .version')"
          echo "tag $tag, crate $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::the tag says $tag but runtimes/rust-video/Cargo.toml says $crate"
            exit 1
          fi

      # The tests decode with codecs of their own (a C one built with cc); openh264's own test is left out without its binary.
      - name: Test the library
        run: cargo test -p clarity-video

      # A version published already (by hand, or by an earlier run of this
      # tag) is left as it is: crates.io never takes a version twice.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#runtimes/rust-video/v}"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'Clarity release (github.com/petervdpas/Clarity)' "https://crates.io/api/v1/crates/clarity-video/$version")"
          if [ "$status" = "200" ]; then
            echo "::notice::clarity-video $version is on crates.io already"
            exit 0
          fi
          cargo publish -p clarity-video
