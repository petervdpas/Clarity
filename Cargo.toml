[workspace]
resolver = "3"
members = ["crates/clarity-spec", "crates/clarity-cli", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clarity-spec = { path = "crates/clarity-spec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
