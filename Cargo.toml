[workspace]
resolver = "3"
members = ["crates/clarity-spec", "crates/clarity-project", "crates/clarity-db", "runtimes/rust", "crates/clarity-gen", "crates/clarity-cli", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clarity-spec = { path = "crates/clarity-spec" }
clarity-project = { path = "crates/clarity-project" }
clarity-db = { path = "crates/clarity-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }

# Line tables keep file and line in backtraces at about half the size of
# full debug info in target/.
[profile.dev]
debug = "line-tables-only"
