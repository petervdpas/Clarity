[workspace]
resolver = "3"
members = ["crates/clarity-spec", "crates/clarity-project", "crates/clarity-db", "crates/clarity-vault", "crates/clarity-agent", "crates/clarity-tools", "crates/clarity-mcp", "crates/clarity-acp", "runtimes/rust", "runtimes/rust-engine", "runtimes/rust-ui", "runtimes/rust-ui-ffi", "runtimes/rust-ui-browser", "runtimes/rust-audio", "runtimes/rust-audio-ffi", "runtimes/rust-video", "runtimes/rust-video-ffi", "runtimes/rust-image", "runtimes/rust-image-ffi", "runtimes/rust-graph", "runtimes/rust-formats", "runtimes/rust-formats-ffi", "runtimes/rust-auth", "runtimes/rust-auth-ffi", "crates/clarity-gen", "crates/clarity-cli", "crates/clarity-wasm", "app/src-tauri"]
# The examples' crates (custom parts, libraries, generated programs) are projects of their own.
exclude = ["examples"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
clarity-spec = { path = "crates/clarity-spec" }
clarity-project = { path = "crates/clarity-project" }
clarity-db = { path = "crates/clarity-db" }
clarity-vault = { path = "crates/clarity-vault" }
clarity-agent = { path = "crates/clarity-agent" }
clarity-tools = { path = "crates/clarity-tools" }
clarity-mcp = { path = "crates/clarity-mcp" }
clarity-acp = { path = "crates/clarity-acp" }
clarity-wasm = { path = "crates/clarity-wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }

# Line tables keep file and line in backtraces at about half the size of
# full debug info in target/.
[profile.dev]
debug = "line-tables-only"

# The vault's key derivation is slow on purpose; unoptimised it takes many
# seconds, so its crates are built optimised in debug builds too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

# Clarity.UI's browser files (runtimes/rust-ui-browser/build.sh): small over fast.
[profile.browser]
inherits = "release"
opt-level = "s"
strip = true
