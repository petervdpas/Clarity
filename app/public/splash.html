<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clarity IDE</title>
    <!-- Clarity's splash screen (src-tauri/src/splash.rs): shown at once, before the IDE's code loads, so it needs none of it. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #15181e;
        color: #e8eaed;
        font-family: system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      .card {
        box-sizing: border-box;
        height: 100%;
        border: 1px solid #2c313a;
        display: grid;
        grid-template-columns: 120px 1fr;
        grid-template-rows: 1fr auto;
        padding: 26px 36px 18px;
        column-gap: 28px;
        background: radial-gradient(circle at 18% 30%, #232833 0%, #15181e 62%);
      }
      .logo svg {
        width: 120px;
        height: 120px;
      }
      .name {
        align-self: center;
      }
      h1 {
        margin: 0;
        font-size: 40px;
        font-weight: 600;
        /* The icon's yellow. */
        color: #f5c400;
        letter-spacing: 0.5px;
      }
      .tagline {
        margin: 6px 0 0;
        color: #9aa3ad;
        font-size: 14px;
      }
      .version {
        margin: 12px 0 0;
        color: #f5c400;
        font-size: 13px;
        font-family: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", monospace;
      }
      .foot {
        grid-column: 1 / 3;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #9aa3ad;
        font-size: 12px;
      }
      .bar {
        flex: 1;
        height: 3px;
        background: #2c313a;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 30%;
        background: #f5c400;
        border-radius: 2px;
        animation: going 1.4s ease-in-out infinite;
      }
      @keyframes going {
        from {
          left: -30%;
        }
        to {
          left: 100%;
        }
      }
      /* A rebuild in development: the build's lines under the name, the newest at the bottom. */
      .log {
        display: none;
      }
      body.building .card {
        grid-template-rows: auto 1fr auto;
        row-gap: 12px;
      }
      body.building .logo svg {
        width: 64px;
        height: 64px;
      }
      body.building .card {
        grid-template-columns: 64px 1fr;
      }
      body.building .log {
        grid-column: 1 / 3;
        margin: 0;
        padding: 8px 10px;
        overflow: hidden;
        background: #0d0f13;
        border: 1px solid #2c313a;
        border-radius: 4px;
        color: #c9ced6;
        font: 11px/1.45 ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", monospace;
        white-space: pre-wrap;
        word-break: break-all;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo" id="logo"></div>
      <div class="name">
        <h1>Clarity IDE</h1>
        <p class="tagline">One language, built on every stack</p>
        <p class="version" id="version"></p>
      </div>
      <pre class="log" id="log" aria-live="polite"></pre>
      <div class="foot">
        <span id="status">Starting</span>
        <span class="bar"></span>
      </div>
    </div>
    <script>
      // What Clarity handed the page before it ran: its name and version, its icon, the first status.
      const shown = window.__clarity_splash || {};
      if (shown.logo) document.getElementById("logo").innerHTML = shown.logo;
      document.getElementById("version").textContent = shown.version ? `Version ${shown.version}` : "";
      document.getElementById("status").textContent = shown.status || "Starting";
      // Clarity says what loads now.
      window.__clarity_splash_status = (text) => {
        document.getElementById("status").textContent = text;
      };
      // A rebuild in development: the splash shows the build, line for line; the last ones show.
      window.__clarity_splash_build = () => {
        document.body.classList.add("building");
        document.getElementById("status").textContent = "Building";
      };
      if (window.__clarity_splash_building) window.__clarity_splash_build();
      // Clarity sends every line so far each time, so none is lost while the page loads.
      window.__clarity_splash_lines = (lines) => {
        window.__clarity_splash_build();
        const log = document.getElementById("log");
        log.replaceChildren(
          ...lines.map((text) => {
            const line = document.createElement("div");
            line.textContent = text;
            return line;
          }),
        );
        if (lines.length) document.getElementById("status").textContent = lines[lines.length - 1];
      };
    </script>
  </body>
</html>
