[package]
name = "clarity-preview"
description = "Live preview of Clarity screen specs"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "clarity_preview"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clarity-spec.workspace = true
clarity-project.workspace = true
# Backups of the project's databases (backups.rs, docs/BACKUP-PLAN.md).
clarity-db.workspace = true
clarity-vault.workspace = true
clarity-agent.workspace = true
# The tools the agent designs and generates with, shared with the MCP server.
clarity-tools.workspace = true
clarity-gen = { path = "../../crates/clarity-gen" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
notify = "8"
# Fetches Clarity.UI's library for Go, C and C++ builds (build.rs), as clarity-agent calls its models.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
base64 = "0.22"
ts-rs.workspace = true
tauri-plugin-dialog = "2"
# The load of the computer and of Clarity, for Clarity settings, System, and the status bar.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }

# WebView2's settings, to turn off its own browser keys (browser_keys.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
# A database for the backups' tests, the same SQLite clarity-db uses.
rusqlite = { version = "0.40", features = ["bundled"] }
