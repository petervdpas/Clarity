[package]
name = "clarity-preview"
description = "Live preview of Clarity screen specs"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "clarity_preview"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clarity-spec.workspace = true
clarity-project.workspace = true
clarity-vault.workspace = true
clarity-agent.workspace = true
clarity-gen = { path = "../../crates/clarity-gen" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
notify = "8"
base64 = "0.22"
ts-rs.workspace = true
tauri-plugin-dialog = "2"
# The load of the computer and of Clarity, for Clarity settings, System, and the status bar.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }

# WebView2's settings, to turn off its own browser keys (browser_keys.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
