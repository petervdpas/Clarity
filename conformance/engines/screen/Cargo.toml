# The engine beside the screen every renderer is tested with
# (conformance/screen-engines.json, DESIGN 5.12): plain WebAssembly with
# Clarity's engine interface and its frame loop, built with
#   cargo build --release --target wasm32-unknown-unknown
# and copied to conformance/engines/screen.wasm.
[package]
name = "screen-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of Clarity's workspace: it builds for WebAssembly on its own.
[workspace]
