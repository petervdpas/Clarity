# The engine every host is tested with (conformance/engines.json): plain
# WebAssembly with Clarity's engine interface, built with
#   cargo build --release --target wasm32-unknown-unknown
# and copied to conformance/engines/test.wasm.
[package]
name = "test-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
rust_decimal = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of Clarity's workspace: it builds for WebAssembly on its own.
[workspace]
