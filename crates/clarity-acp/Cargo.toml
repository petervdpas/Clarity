[package]
name = "clarity-acp"
description = "Clarity as an ACP client: the chat panel talks to the person's own agent program (Codex, Copilot), signed in with its own login"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# ACP is JSON-RPC lines over the program's stdin and stdout, spoken with serde_json
# itself: no ACP crate (docs/ACP-PLAN.md, "go non standard use json_something then!").
serde_json.workspace = true
# The version the workspace already has through the IDE: the program, its pipes, the channels.
tokio = { version = "1.53.3", features = ["rt", "sync", "process", "io-util"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "sync", "process", "io-util", "macros"] }
