[package]
name = "clarity-mcp"
description = "Clarity as an MCP server: an agent designs and generates the project open in the Clarity IDE, over stdio"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
clarity-agent.workspace = true
clarity-project.workspace = true
clarity-tools.workspace = true
serde_json.workspace = true
# The official Rust MCP SDK: a server over stdio, nothing else (docs/MCP-PLAN.md).
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
# The version the workspace already has through the IDE.
tokio = { version = "1.53.3", features = ["rt"] }

[dev-dependencies]
# The other end of the round trip in the tests.
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io", "client"] }
tokio = { version = "1.53.3", features = ["rt", "macros", "io-util"] }
