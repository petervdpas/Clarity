[package]
name = "clarity-project"
description = "The Clarity project file: stack, targets, output and data sources"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
clarity-spec.workspace = true
clarity-db.workspace = true
serde.workspace = true
# Clarity's folders, kept in folders.json.
serde_json.workspace = true
ts-rs.workspace = true
# Whether the IDE that recorded its open project still runs (ide.rs); the IDE's own version and features.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# OpenAPI descriptions in YAML or JSON (DESIGN 5.23).
yaml-rust2 = "0.13"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
