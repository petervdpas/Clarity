# The support module of engines written in Clarity (DESIGN 5.12, N5b): the
# engine interface, values, JSON, kept values. Built once with
#   cargo build --release --target wasm32-unknown-unknown
# and copied to crates/clarity-wasm/support.wasm, which the compiler adds
# each engine's functions to.
[package]
name = "clarity-wasm-support"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
rust_decimal = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[workspace]
