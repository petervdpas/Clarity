# The crate that draws custom part Dice with Bevy. Clarity builds it into the program.
[package]
name = "dice_part"
version = "0.1.0"
edition = "2024"

[dependencies]
# Clarity.UI, whose control the part is: src/clarity.rs implements its CustomPart.
clarity-ui = "0.8.0"
serde_json = "1"
# Bevy's 3D renderer only, headless: it draws into a picture of its own that
# the part reads back and puts in its place. No window, no window loop of its
# own (the part's wake-ups run its updates), no audio, no UI.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "tonemapping_luts",
    "zstd_rust",
] }
