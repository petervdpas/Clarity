# The crate that draws custom part Dice with Bevy, a control of Clarity.UI drawn
# through its library. Clarity builds it into the program.
[package]
name = "dice_part"
version = "0.1.0"
edition = "2024"

[dependencies]
# What the window gives and the part tells, as JSON; src/clarity.rs holds the rest.
serde_json = "1"
# Bevy's 3D renderer only, headless: it draws into a picture of its own that
# the part reads back and puts in its place. No window, no window loop of its
# own (the part's wake-ups run its updates), no audio, no UI.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "tonemapping_luts",
    "zstd_rust",
] }
