# The Translate engine of the modelling example: writes a type of the model
# as C# code, and reads the types of a Formidable export. Built to ../translate.wasm by examples/build-engines.sh.
[package]
name = "translate"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clarity-engine = { path = "../../../../runtimes/rust-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
