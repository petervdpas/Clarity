# The Board engine of the noughts example: a game of noughts and crosses,
# one board per open window. Built with
#   cargo build --release --target wasm32-unknown-unknown
# into ../board.wasm (see examples/build-engines.sh).
[package]
name = "board"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clarity-engine = { path = "../../../../crates/clarity-engine" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of Clarity's workspace: it builds for WebAssembly on its own.
[workspace]
