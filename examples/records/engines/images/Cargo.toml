# The Images engine of the records example: the size of a picture, read
# from its file's first bytes. Built with
#   cargo build --release --target wasm32-unknown-unknown
# into ../images.wasm (see examples/build-engines.sh).
[package]
name = "images"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clarity-engine = { path = "../../../../runtimes/rust-engine" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of Clarity's workspace: it builds for WebAssembly on its own.
[workspace]
