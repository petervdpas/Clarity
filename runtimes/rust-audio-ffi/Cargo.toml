[package]
name = "clarity-audio-ffi"
description = "The C interface of Clarity.Audio: the songs of the programs C#, Go, C and C++ make with Clarity"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
homepage = "https://github.com/petervdpas/Clarity"
# Shipped as a native library beside Clarity.UI's, not on crates.io.
publish = false

# The library's file is clarity_audio on every system: libclarity_audio.so,
# clarity_audio.dll, libclarity_audio.dylib.
[lib]
name = "clarity_audio"
crate-type = ["cdylib", "rlib"]

[dependencies]
audio = { package = "clarity-audio", path = "../rust-audio" }
