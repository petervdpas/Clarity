[package]
name = "clarity-audio"
description = "Clarity.Audio: plays mp3, flac, wav and ogg files for the programs Clarity generates, with pause, seek, position and length"
# Released on its own (tag runtimes/rust-audio/vX.Y.Z).
version = "0.2.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
readme = "README.md"
keywords = ["clarity", "audio", "music", "player"]
categories = ["multimedia::audio"]
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
# The system's audio output on Linux, Windows and macOS, and Symphonia's
# decoders: pure Rust, no system libraries, so one prebuilt library plays
# every format on every system (user's choice, 2026-11-06).
# mp4 (AAC in an MP4) is a video's sound, which Clarity.UI's video part plays.
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4"] }
# Tags (title, artist, album, track) read with the same Symphonia rodio decodes with.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "isomp4", "aac"] }
