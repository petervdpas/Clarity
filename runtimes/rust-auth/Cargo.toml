[package]
name = "clarity-auth"
description = "Clarity.Auth: the sign-in strategies of the programs Clarity generates (password, the computer's account, tokens), sessions and failed tries, alike on every stack"
# Released on its own (tag runtimes/rust-auth/vX.Y.Z).
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
homepage = "https://github.com/petervdpas/Clarity"
readme = "README.md"
keywords = ["clarity", "signin", "argon2", "sessions"]
categories = ["authentication"]
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
argon2 = "0.5"
base64 = "0.22"
getrandom = "0.3"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
# The `openid` strategy calls the provider's token endpoint.
ureq = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The `openid` strategy's flow (OpenID Connect with PKCE), which calls the
# provider over HTTP; a program without it carries no HTTP client.
openid = ["dep:ureq"]

[[test]]
name = "openid"
required-features = ["openid"]
