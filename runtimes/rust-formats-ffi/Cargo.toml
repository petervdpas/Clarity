[package]
name = "clarity-formats-ffi"
description = "The C interface of Clarity.Formats: the data formats of the programs C#, Go, C and C++ make with Clarity"
version = "0.2.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
homepage = "https://github.com/petervdpas/Clarity"
# Shipped as a native library beside Clarity.UI's, not on crates.io.
publish = false

# The library's file is clarity_formats on every system: libclarity_formats.so,
# clarity_formats.dll, libclarity_formats.dylib.
[lib]
name = "clarity_formats"
crate-type = ["cdylib", "rlib"]

[dependencies]
formats = { package = "clarity-formats", path = "../rust-formats" }
