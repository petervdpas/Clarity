[package]
name = "clarity-formats"
description = "Clarity.Formats: the data formats of the programs Clarity generates (JSON first), read and fitted to records and written, alike on every stack"
# Released on its own (tag runtimes/rust-formats/vX.Y.Z).
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
homepage = "https://github.com/petervdpas/Clarity"
readme = "README.md"
keywords = ["clarity", "json", "formats", "records"]
categories = ["encoding", "parser-implementations"]
include = ["src/**", "README.md", "LICENSE"]

# No dependencies: its own tree keeps numbers exactly as written and object
# names in their order, without changing serde_json for a whole build.
[dependencies]
