[package]
name = "clarity-image-ffi"
description = "The C interface of Clarity.Image: the picture functions of the programs C#, Go, C and C++ make with Clarity"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
homepage = "https://github.com/petervdpas/Clarity"
# Shipped as a native library beside Clarity.UI's, not on crates.io.
publish = false

# The library's file is clarity_image on every system: libclarity_image.so,
# clarity_image.dll, libclarity_image.dylib.
[lib]
name = "clarity_image"
crate-type = ["cdylib", "rlib"]

[dependencies]
pictures = { package = "clarity-image", path = "../rust-image" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
