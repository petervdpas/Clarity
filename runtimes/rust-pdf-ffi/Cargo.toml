[package]
name = "clarity-pdf-ffi"
description = "The C interface of Clarity.Pdf: the PDFs of the programs C#, Go, C and C++ make with Clarity"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
# Shipped as a native library beside Clarity.UI's, not on crates.io.
publish = false

# The library's file is clarity_pdf on every system: libclarity_pdf.so,
# clarity_pdf.dll, libclarity_pdf.dylib.
[lib]
name = "clarity_pdf"
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf = { package = "clarity-pdf", path = "../rust-pdf" }
