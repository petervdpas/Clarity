[package]
name = "clarity-ui-browser"
description = "Clarity.UI in the browser: the library compiled once to WebAssembly, with the worker and page scripts every language's web server serves"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
# Shipped as the browser files (clarity-ui-<version>-browser.tar.gz), not on crates.io.
publish = false

# Built for wasm32-unknown-emscripten only (build.sh): Emscripten writes
# clarity-ui.js and clarity-ui.wasm from this program. On any other target
# it is an empty program.
[[bin]]
name = "clarity-ui"
path = "src/main.rs"

[dependencies]
clarity-ui = { path = "../rust-ui" }
base64 = "0.22"
# Skia only from skia-safe's prebuilt binaries: a build that would compile
# it from source stops instead (hours, and more memory than a laptop has).
skia-bindings = { version = "0.156", default-features = false, features = ["no-compile"] }
