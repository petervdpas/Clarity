[package]
name = "clarity-ui"
description = "Clarity.UI: Clarity's own UI framework, drawn with Skia, the one library behind the programs Clarity generates in every language"
# Released on its own (tag runtimes/rust-ui/vX.Y.Z), after the clarity-runtime it names.
version = "0.4.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
homepage = "https://github.com/petervdpas/Clarity"
readme = "README.md"
keywords = ["clarity", "ui", "skia", "gui"]
categories = ["gui", "graphics"]
include = ["src/**", "fonts/**", "themes/**", "catalog/**", "README.md", "LICENSE"]

# The desktop host: the system's window through winit, OpenGL through glutin.
# Tests and other hosts draw on Skia's raster surface without it. A browser
# build leaves it out by its target: the `browser` host takes its place.
[features]
default = ["desktop"]
desktop = ["dep:winit", "dep:glutin", "dep:glutin-winit", "dep:arboard", "dep:rodio", "dep:accesskit_winit"]

[dependencies]
clarity-runtime = { path = "../rust", version = "0.44.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A new picture or file goes to the program as base64 in its JSON value.
base64 = "0.22"
# One feature set for every build, with prebuilt binaries on Linux, Windows
# and macOS and for the browser (wasm32-unknown-emscripten), ("gl" and
# "textlayout"): Skia is never built from source.
skia-safe = { version = "0.156", features = ["gl", "textlayout"] }
# SVG pictures, read and drawn into a bitmap at the size they show (user's
# choice, 2026-11-02); brings usvg and tiny-skia. Skia's own SVG module has
# no prebuilt binaries for every system with this feature set.
resvg = "0.49"
# Screen readers (DESIGN 7.9, A1, user's choice 2026-11-04): the accessibility
# tree as AccessKit's nodes, on every system and in the browser build.
accesskit = "0.25"

# The desktop host's crates; a browser build (wasm32-unknown-emscripten) has
# none of them: the page does the window, clipboard, sound and files there.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
# The system's clipboard on Linux, Windows and macOS (user's choice, 2026-11-02).
arboard = { version = "3.7", optional = true }
# Sound: the system's audio output on Linux, Windows and macOS (user's
# choice, 2026-11-02). Playback only, no decoders: Clarity makes its own
# samples (tones and melodies) and plays them as they are.
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback"] }
# The accessibility tree handed to the system's screen reader: AT-SPI on
# Linux, UI Automation on Windows, the accessibility API on macOS; the
# version made for winit 0.30.
accesskit_winit = { version = "0.34", optional = true }
