[package]
name = "clarity-ui"
description = "Clarity.UI for Rust: Clarity's own UI framework, drawn with Skia, for programs generated by Clarity"
# Released on its own later, like clarity-runtime.
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
homepage = "https://github.com/petervdpas/Clarity"
readme = "README.md"
keywords = ["clarity", "ui", "skia", "gui"]
categories = ["gui", "graphics"]
include = ["src/**", "fonts/**", "themes/**", "catalog/**", "README.md", "LICENSE"]

# The desktop host: the system's window through winit, OpenGL through glutin.
# Tests and other hosts draw on Skia's raster surface without it.
[features]
default = ["desktop"]
desktop = ["dep:winit", "dep:glutin", "dep:glutin-winit", "dep:arboard", "dep:rodio"]

[dependencies]
clarity-runtime = { path = "../rust", version = "0.42.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A new picture or file goes to the program as base64 in its JSON value.
base64 = "0.22"
# One feature set for every build, with prebuilt binaries on Linux, Windows
# and macOS ("gl" and "textlayout"): Skia is never built from source.
skia-safe = { version = "0.156", features = ["gl", "textlayout"] }
# SVG pictures, read and drawn into a bitmap at the size they show (user's
# choice, 2026-11-02); brings usvg and tiny-skia. Skia's own SVG module has
# no prebuilt binaries for every system with this feature set.
resvg = "0.49"
winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
# The system's clipboard on Linux, Windows and macOS (user's choice, 2026-11-02).
arboard = { version = "3.7", optional = true }
# Sound: the system's audio output on Linux, Windows and macOS (user's
# choice, 2026-11-02). Playback only, no decoders: Clarity makes its own
# samples (tones and melodies) and plays them as they are.
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback"] }
