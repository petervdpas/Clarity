[package]
name = "clarity-ui"
description = "Clarity.UI for Rust: Clarity's own UI framework, drawn with Skia, for programs generated by Clarity"
# Released on its own later, like clarity-runtime.
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
homepage = "https://github.com/petervdpas/Clarity"
readme = "README.md"
keywords = ["clarity", "ui", "skia", "gui"]
categories = ["gui", "graphics"]
include = ["src/**", "fonts/**", "themes/**", "catalog/**", "README.md", "LICENSE"]

# The desktop host: the system's window through winit, OpenGL through glutin.
# Tests and other hosts draw on Skia's raster surface without it.
[features]
default = ["desktop"]
desktop = ["dep:winit", "dep:glutin", "dep:glutin-winit"]

[dependencies]
clarity-runtime = { path = "../rust", version = "0.42.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One feature set for every build, with prebuilt binaries on Linux, Windows
# and macOS ("gl" and "textlayout"): Skia is never built from source.
skia-safe = { version = "0.156", features = ["gl", "textlayout"] }
winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
