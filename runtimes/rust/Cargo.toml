[package]
name = "clarity-runtime"
description = "Runtime library for applications generated by Clarity: records, storage in SQLite, PostgreSQL, MySQL and SQL Server, migrations, contract checks and WebAssembly engines"
# The runtime's own version, released on its own (tag runtimes/rust/vX.Y.Z,
# then cargo publish); Clarity's Rust generator requires this version.
version = "0.32.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
homepage = "https://github.com/petervdpas/Clarity"
readme = "README.md"
keywords = ["clarity", "codegen", "database", "tauri"]
categories = ["database", "development-tools"]
# The library and its README; the tests read Clarity's shared cases, which
# live outside the crate.
include = ["src/**", "README.md", "LICENSE"]

# One feature per database; a generated application turns on the ones its
# data sources use.
[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:postgres", "dep:bytes", "rust_decimal/db-postgres"]
mysql = ["dep:mysql"]
mssql = ["dep:tiberius", "dep:tokio", "dep:tokio-util"]
# Engines (DESIGN 5.11): WebAssembly modules hosted through wasmi.
engines = ["dep:wasmi"]
# Custom parts written in Rust (DESIGN 5.19): their host, which draws them
# in native child windows: X11 on Linux, Win32 on Windows.
parts = ["dep:windows-sys"]
# HTTP calls from code (DESIGN 5.23), through ureq with rustls.
http = ["dep:ureq"]
# Secret settings (DESIGN 5.27): the system's protected store. The
# Credential Manager through Win32 itself, written as every stack writes it
# (conformance/secret-store.json); the Keychain and the Secret Service over
# D-Bus through keyring.
secrets = ["dep:keyring", "dep:windows-sys", "windows-sys?/Win32_Security_Credentials"]

[dependencies]
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
postgres = { version = "0.19", features = ["with-chrono-0_4"], optional = true }
bytes = { version = "1", optional = true }
mysql = { version = "28", default-features = false, features = ["minimal-rust"], optional = true }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "chrono", "rust_decimal", "rustls"], optional = true }
tokio = { version = "1", features = ["rt", "net"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "stable"], optional = true }
ureq = { version = "3", optional = true }

# The protected store of macOS and the other systems; Windows has its own (secrets.rs).
[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6.3", optional = true, default-features = false, features = ["apple-native", "async-secret-service", "async-io", "crypto-rust"] }

# The part host's child windows on Windows, and the Credential Manager of the
# secrets; on Linux the part host calls X11 directly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# The secrets test reads a credential back through Win32, to see how it was kept.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
