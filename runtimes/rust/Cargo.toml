[package]
name = "clarity-runtime"
description = "Runtime library for applications generated by Clarity: records, storage in SQLite, PostgreSQL, MySQL and SQL Server, migrations, contract checks and WebAssembly engines"
# The runtime's own version, released on its own (tag runtimes/rust/vX.Y.Z,
# then cargo publish); Clarity's Rust generator requires this version.
version = "0.10.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/petervdpas/Clarity"
homepage = "https://github.com/petervdpas/Clarity"
readme = "README.md"
keywords = ["clarity", "codegen", "database", "tauri"]
categories = ["database", "development-tools"]
# The library and its README; the tests read Clarity's shared cases, which
# live outside the crate.
include = ["src/**", "README.md", "LICENSE"]

# One feature per database; a generated application turns on the ones its
# data sources use.
[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:postgres", "dep:bytes", "rust_decimal/db-postgres"]
mysql = ["dep:mysql"]
mssql = ["dep:tiberius", "dep:tokio", "dep:tokio-util"]
# Engines (DESIGN 5.11): WebAssembly modules hosted through wasmi.
engines = ["dep:wasmi"]

[dependencies]
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
postgres = { version = "0.19", features = ["with-chrono-0_4"], optional = true }
bytes = { version = "1", optional = true }
mysql = { version = "28", default-features = false, features = ["minimal-rust"], optional = true }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "chrono", "rust_decimal", "rustls"], optional = true }
tokio = { version = "1", features = ["rt", "net"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "stable"], optional = true }
